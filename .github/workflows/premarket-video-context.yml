name: Premarket Video Context

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Optional direct YouTube video URL. Leave empty to use latest Vincent Desiano stream/video.
        required: false
        default: ""
      transcript_text:
        description: Optional pasted transcript/captions text. Use this if YouTube blocks GitHub.
        required: false
        default: ""
      watchlist:
        description: Stock symbols to extract from the transcript
        required: true
        default: AAPL,NVDA,SNDK,INTC,GOOGL,MSFT,AMZN,META,TSLA,AMD,AVGO,JPM,V,MA,NFLX,COST,ORCL,CRM,ADBE,SPY,QQQ,IWM

jobs:
  premarket-video-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Analyze latest premarket video
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          TRANSCRIPT_TEXT: ${{ github.event.inputs.transcript_text }}
          WATCHLIST: ${{ github.event.inputs.watchlist }}
        run: |
          if [ -n "$VIDEO_URL" ]; then
            python scripts/premarket_youtube_context.py \
              --video-url "$VIDEO_URL" \
              --watchlist "$WATCHLIST" \
              --transcript-text "$TRANSCRIPT_TEXT" \
              --discord \
              --debug-transcript
          else
            python scripts/premarket_youtube_context.py \
              --watchlist "$WATCHLIST" \
              --transcript-text "$TRANSCRIPT_TEXT" \
              --discord \
              --debug-transcript
          fi
