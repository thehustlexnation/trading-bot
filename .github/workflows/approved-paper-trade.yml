name: Approved Paper Trade

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Stock symbol
        required: true
      strategy:
        description: Strategy name from Slack alert
        required: true
      direction:
        description: LONG or SHORT
        required: true
      entry:
        description: Entry reference price from alert
        required: true
      stop:
        description: Stop loss price from alert
        required: true
      target:
        description: Optional target price. Leave blank to use target_r.
        required: false
        default: ""
      risk_dollars:
        description: Dollar risk budget, for example 100
        required: true
        default: "100"
      target_r:
        description: Target R if target is blank
        required: true
        default: "2.0"
      submit_paper:
        description: Type true to submit to Alpaca paper. Anything else is dry-run.
        required: true
        default: "false"

jobs:
  approved-paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install alpaca-py python-dotenv pandas sqlalchemy psycopg2-binary

      - name: Execute approved paper trade
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          TARGET="${{ github.event.inputs.target }}"
          SUBMIT_FLAG=""
          if [ "${{ github.event.inputs.submit_paper }}" = "true" ]; then
            SUBMIT_FLAG="--submit-paper"
          fi
          TARGET_ARGS=""
          if [ -n "$TARGET" ]; then
            TARGET_ARGS="--target $TARGET"
          fi
          python scripts/execute_approved_trade.py \
            --symbol "${{ github.event.inputs.symbol }}" \
            --strategy "${{ github.event.inputs.strategy }}" \
            --direction "${{ github.event.inputs.direction }}" \
            --entry "${{ github.event.inputs.entry }}" \
            --stop "${{ github.event.inputs.stop }}" \
            --risk-dollars "${{ github.event.inputs.risk_dollars }}" \
            --target-r "${{ github.event.inputs.target_r }}" \
            $TARGET_ARGS \
            $SUBMIT_FLAG \
            --slack-webhook-url "$SLACK_WEBHOOK_URL"
