name: Mobile Signal Alerts

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Stock symbols to scan, comma-separated
        required: true
        default: AAPL,NVDA,AMD,AVGO,SNDK,INTC,GOOGL,QQQ
      cutoff:
        description: New York cutoff time
        required: true
        default: "10:15"
      strategies:
        description: Strategy lanes to scan, comma-separated
        required: true
        default: ORB_RETEST_RECLAIM_BODY_2R,HTF_BREAKOUT_RETEST_2R,VWAP_EMA9_CROSS_2R
      htf_symbols:
        description: HTF strategy symbols, comma-separated
        required: true
        default: AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,AMD,AVGO,JPM,V,MA,NFLX,COST,ORCL,CRM,ADBE,QQQ
      news_start:
        description: New York start time for economic news risk check
        required: false
        default: "08:00"
      news_end:
        description: New York end time for economic news risk check
        required: false
        default: "10:30"
      submit_paper:
        description: Type true to auto-submit qualifying Alpaca paper trades. Anything else is alerts only.
        required: false
        default: "false"

concurrency:
  group: mobile-signal-alerts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-signal-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 140

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install alpaca-py python-dotenv pandas sqlalchemy psycopg2-binary pytest

      - name: Check ForexFactory news risk
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          NEWS_START="${{ github.event.inputs.news_start || '08:00' }}"
          NEWS_END="${{ github.event.inputs.news_end || '10:30' }}"
          python scripts/forexfactory_news_risk.py \
            --countries USD \
            --impacts High \
            --start "$NEWS_START" \
            --end "$NEWS_END" \
            --slack

      - name: Check stock catalyst risk
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          SYMBOLS="${{ github.event.inputs.symbol || 'AAPL,NVDA,AMD,AVGO,SNDK,INTC,GOOGL,QQQ' }}"
          HTF_SYMBOLS="${{ github.event.inputs.htf_symbols || 'AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,AMD,AVGO,JPM,V,MA,NFLX,COST,ORCL,CRM,ADBE,QQQ' }}"
          WATCHLIST="$SYMBOLS,$HTF_SYMBOLS"
          python scripts/stock_catalyst_risk.py \
            --symbols "$WATCHLIST" \
            --lookback-days 1 \
            --lookahead-days 7 \
            --slack

      - name: Run live dry-run signal watcher
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SYMBOLS="${{ github.event.inputs.symbol || 'AAPL,NVDA,AMD,AVGO,SNDK,INTC,GOOGL,QQQ' }}"
          CUTOFF="${{ github.event.inputs.cutoff || '10:15' }}"
          NEWS_START="${{ github.event.inputs.news_start || '08:00' }}"
          NEWS_END="${{ github.event.inputs.news_end || '10:30' }}"
          STRATEGIES="${{ github.event.inputs.strategies || 'ORB_RETEST_RECLAIM_BODY_2R,HTF_BREAKOUT_RETEST_2R,VWAP_EMA9_CROSS_2R' }}"
          HTF_SYMBOLS="${{ github.event.inputs.htf_symbols || 'AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,AMD,AVGO,JPM,V,MA,NFLX,COST,ORCL,CRM,ADBE,QQQ' }}"
          SUBMIT_ARGS=""
          if [ "${{ github.event.inputs.submit_paper || 'false' }}" = "true" ]; then
            SUBMIT_ARGS="--submit --auto-submit-watch"
          fi
          python scripts/paper_trade.py \
            --symbols "$SYMBOLS" \
            --htf-symbols "$HTF_SYMBOLS" \
            --strategies "$STRATEGIES" \
            --source live \
            --watch \
            --slack \
            --alert-status \
            --poll-seconds 60 \
            --cutoff "$CUTOFF" \
            --macro-news-start "$NEWS_START" \
            --macro-news-end "$NEWS_END" \
            --equity 10000 \
            $SUBMIT_ARGS
