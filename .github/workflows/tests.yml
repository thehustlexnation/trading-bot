name: Trading Runtime Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
        env:
          PYTHONPATH: .
      - name: Check shadow-only runtime configuration
        run: python scripts/realtime_runner.py --check
      - name: Build isolated runtime container
        run: docker build --tag trading-shadow:test .
